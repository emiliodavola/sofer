[project]
name = "sofer"
dynamic = ["version"]
description = "Turn raw datasets into documented, profiled, and quality-assessed packages (codebooks, semantic inference, PII detection, validation, and an optional MCP server for AI agents) publishable to Hugging Face Hub or any local directory."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Emilio Davola" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "fastmcp>=3.4,<4",
    "huggingface-hub>=0.26.0",
    "openpyxl>=3.1",
    "pyarrow>=14.0",
    "python-dotenv>=1.0.0",
    "tomli>=2.0; python_version < '3.11'",
    "tomli-w>=1.0",
    "pyyaml>=6.0",
    "datasets>=5.0.1",
    # Split by interpreter on purpose: numpy 2.2.x ships no cp314 wheel, so a single ceiling made
    # 3.14 build numpy from source (12 min) and crash with an access violation at import
    # (CI: windows-latest 3.14). Below 3.14 the ceiling is kept; on 3.14 the floor selects a
    # release that actually publishes cp314 wheels.
    "numpy<2.3; python_version < '3.14'",
    "numpy>=2.3; python_version >= '3.14'",
]

[project.urls]
Homepage = "https://github.com/emiliodavola/sofer"
Repository = "https://github.com/emiliodavola/sofer"
Issues = "https://github.com/emiliodavola/sofer/issues"

[project.optional-dependencies]
mcp = ["fastmcp>=3.4,<4"]

[project.scripts]
sofer = "sofer.cli:main"
sofer-mcp = "sofer.mcp_server:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff==0.16.7",
    "mypy==2.3.0",
    "pre-commit>=4.0.0",
    "fastmcp>=3.4,<4",
    "coverage>=7.16.0",
    "types-openpyxl>=3.1.5.20260827",
    "types-pyyaml>=6.0.12.20260906",
    "pyright==1.1.414",
]

# ── Ruff: linter & formatter ─────────────────────────────────────────────

[tool.ruff]
target-version = "py310"
line-length = 100
# Single authoritative ruff version: equal to the dev-group pin above and to the
# `ruff-pre-commit` rev; the three declarations are forced to agree by CI-08's guards in
# tests/test_ci_workflows.py. A drifting binary fails ruff here, at config load.
required-version = "==0.16.7"
# Design docs and specs under openspec/ embed Python snippets inside markdown;
# the formatter rewrites those blocks, producing noise diffs on historical
# SDD artifacts. They are documentation, not source — keep them out of scope.
extend-exclude = ["openspec"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "RUF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ── mypy: static type checking ───────────────────────────────────────────

[tool.mypy]
python_version = "3.11"
strict = true
check_untyped_defs = true
ignore_missing_imports = true
warn_unused_ignores = true
exclude = ["tests/", ".venv/"]

[[tool.mypy.overrides]]
module = [
    "pyarrow",
    "pyarrow.*",
    "datasets",
    "datasets.*",
]

# ── pyright: second type checker (real gate) ─────────────────────────────
# Not advisory: `uv run pyright` is a gate in the CI `lint` job and in the
# pre-commit hooks. `standard` is the strongest mode reachable without a cleanup
# campaign — `basic` would silently drop the one real defect it found
# (`_converters.py:650`), and `strict` is a 578-error campaign, not a policy
# change. `pythonVersion` mirrors the gate interpreter (`.python-version`, 3.13)
# because pyright analyses the runtime environment it runs in: there the
# `tomllib` arm is the live one and the `tomli` fallback arm is the stale one the
# stub below targets. The scope is the enforced mypy scope; `tests/` is excluded
# from BOTH type gates by policy (openspec/specs/ci/spec.md CI-09). `venvPath`/
# `venv` are declared so import resolution can never depend on an inherited
# VIRTUAL_ENV. Invoke it as `uv run pyright` — never bare, never `uvx`.
[tool.pyright]
typeCheckingMode = "standard"
pythonVersion = "3.13"
venvPath = "."
venv = ".venv"
include = ["src", "scripts"]
exclude = ["tests", ".venv", "**/node_modules", "**/__pycache__"]
stubPath = "typings"
reportMissingImports = "error"

# ── pytest ───────────────────────────────────────────────────────────────

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
pythonpath = ["scripts"]

# ── coverage.py ──────────────────────────────────────────────────────────

[tool.coverage.run]
branch = true
source = ["src/sofer"]

[tool.coverage.report]
show_missing = true
fail_under = 90

# ── sofer tool-wide defaults ──────────────────────────────────────

[tool.sofer]
# ── Scan defaults ──
output_dir = "cache"
raw_dir = "raw"
default_config_name = "dataset.toml"

# ── Parquet defaults ──
parquet_row_group_size = 100_000
parquet_compression = "zstd"
parquet_shard_warning_mb = 500

# ── Report defaults ──
report_max_items = 10
report_max_modified = 5
report_max_corrupt_records = 20
report_line_width = 50
report_sub_line_width = 30

# ── Codebook defaults ──
codebooks_dir = "codebooks"
codebook_max_sample = 100_000
codebook_numeric_threshold = 0.9
codebook_mixed_threshold = 0.5

# ── Encoding / IO ──
output_encoding = "utf-8"
probe_chunk_bytes = 8192
csv_delimiter = ";"
csv_encoding = "utf-8-sig"

# ── Sniffing ──
sniff_delimiters = [";", ",", "\t"]

# ── Dataset Card ──
card_fallback_rows_per_file = 100
card_modality_tags = ["tabular", "text", "image", "audio", "video", "timeseries", "geospatial", "3d"]
card_boolean_values = ["true", "false", "1", "0", "yes", "no"]
card_collapse_threshold = 15

# ── Schema report ──
# Rows sampled per file for schema inference (schema report + card footnote).
schema_sample_size = 10_000
# Duplicate column names across files at or below this count emit individual
# warnings; above it a single summary (repo_compliance.build_schema_report).
schema_dup_threshold = 3

# ── Report truncation limits (issue #189) ──
# Distinct quality values per column truncate to this many chars.
quality_value_preview_len = 50
# Unclassified filenames listed by splits.validate_layout (slice + guard).
splits_max_unclassified_names = 5

# ── Metadata core (profile / render) ──
# All keys optional — these mirror the code defaults in src/sofer/config.py.
# Prior probability per semantic detector name (email prior 0.98: the @ + TLD
# structure is distinctive, so a regex match-rate near 1.0 is highly reliable).
semantic_priors = { email = 0.98 }
confirm_threshold = 0.8   # confidence >= this -> status "confirmed"
min_threshold = 0.5       # confidence >= this -> status "inferred"
detect_threshold = 0.5    # match_rate below this -> no detection (None)
profile_max_sample = 100000
confidence_round_digits = 4
profile_dir = "profiles"
render_dir = "renders"

# ── MCP agent resources ──
# Size guard for sofer://dataset | sofer://codebook | sofer://metadata reads.
agent_resource_max_bytes = 50000000
# Size cap for the MCP tool "output" envelope (captured stdout/stderr):
# larger outputs are truncated, not refused.
output_max_bytes = 1_000_000

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.sdist]
# `typings/` is a type-checker artifact: it must never ship in a distribution.
# The wheel already excludes it (hatchling's src-layout selection builds
# src/sofer); this keeps the sdist to the same rule.
exclude = ["/typings"]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"
