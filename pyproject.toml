[project]
name = "data-uploader"
version = "0.1.0"
description = "Publish any dataset to Hugging Face Hub with built-in validation and data-sharing standards."
requires-python = ">=3.10"
dependencies = [
    "huggingface-hub>=0.26.0",
    "python-dotenv>=1.0.0",
    "tomli>=2.0; python_version < '3.11'",
    "tomli-w>=1.0",
]

[project.scripts]
data-uploader = "data_uploader.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.9.0",
    "mypy>=1.15.0",
    "pre-commit>=4.0.0",
]

# ── Ruff: linter & formatter ─────────────────────────────────────────────

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "RUF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ── mypy: static type checking ───────────────────────────────────────────

[tool.mypy]
python_version = "3.10"
strict = false
check_untyped_defs = true
ignore_missing_imports = true
warn_unused_ignores = true
exclude = ["tests/", ".venv/"]

# ── pytest ───────────────────────────────────────────────────────────────

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
