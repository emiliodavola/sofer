# Dependabot version updates.
#
# Dependabot alerts and security updates are free for private repositories, so
# this is the dependency signal available while the repository is private (code
# scanning needs GitHub Code Security there); it keeps working unchanged once
# the repository is public. Alerts themselves are toggled in
# Settings → Code security; this file drives the update pull requests.
version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      python-minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      actions-minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
