name: CI

on:
  pull_request:
    branches: [main, dev]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: uv sync
      - name: Lint with ruff
        run: uv run ruff check src/ tests/ scripts/
      - name: Type check with mypy
        run: uv run mypy src/ scripts/
      - name: Type check with pyright
        run: uv run pyright

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync

      # ── Complete-suite test gate (PB-05) ──────────────────────────────
      # `uv run pytest -v` runs the FULL suite — unit, integration, and the
      # process-boundary modules (stdio MCP transport + CLI subprocess). This
      # step is the deliberate test gate: no focused-only command (e.g. a
      # single test file) may replace it, or cross-module regressions would
      # go unseen. Keep the invocation exactly as-is.
      - name: Run tests
        run: uv run pytest -v

      - name: Run CLI help smoke test
        run: uv run sofer --help

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync

      # ── Complete-suite coverage gate (CI-01 + PB-05) ─────────────────────
      # `uv run coverage run -m pytest` re-executes the FULL suite under
      # instrumentation — never a focused subset. The 90% floor is declared
      # once in pyproject.toml under [tool.coverage.report]; the gate is
      # config-declared and never flag-driven — coverage.py reads the floor
      # itself, so no threshold literal or CLI flag belongs in this file.
      - name: Run tests under coverage
        run: uv run coverage run -m pytest

      # The gate: coverage.py enforces the config-declared floor and exits
      # non-zero below it. `-m` puts per-file missed lines in the job log.
      - name: Report coverage with missing lines (the gate)
        run: uv run coverage report -m

      # ── CLI-core 100% gates (COV-06, AGENTS.md rule 14) ─────────────
      # Four scoped per-file invocations in scripts/check_core_coverage.sh:
      # each core module must measure 100.00% with zero `# pragma: no cover`.
      # Additive and scoped per file; the TOTAL gate stays config-owned.
      - name: Gate core module coverage (COV-06)
        run: bash scripts/check_core_coverage.sh

      - name: Generate HTML coverage report
        run: uv run coverage html

      # Self-hosted evidence (CI-02): htmlcov artifact, no third-party service.
      # retention-days deliberately omitted — GitHub's 90-day default is
      # platform policy, not a value this repo should hardcode.
      - name: Upload htmlcov artifact
        uses: actions/upload-artifact@v7
        with:
          name: coverage-html
          path: htmlcov