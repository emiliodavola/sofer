name: CI

on:
  pull_request:
    branches: [main, dev]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: uv sync
      - name: Lint with ruff
        run: uv run ruff check src/ tests/ scripts/
      - name: Type check with mypy
        run: uv run mypy src/ scripts/

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync

      # ── Complete-suite test gate (PB-05) ──────────────────────────────
      # `uv run pytest -v` runs the FULL suite — unit, integration, and the
      # process-boundary modules (stdio MCP transport + CLI subprocess). This
      # step is the deliberate test gate: no focused-only command (e.g. a
      # single test file) may replace it, or cross-module regressions would
      # go unseen. Keep the invocation exactly as-is.
      - name: Run tests
        run: uv run pytest -v

      - name: Run CLI help smoke test
        run: uv run sofer --help
