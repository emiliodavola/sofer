name: Release

# Publishes a GitHub Release when a version tag (v*) is pushed.
# Runs the same quality gates as CI first; if anything fails,
# no release is created. The test job mirrors ci.yml's OS axis
# (ubuntu-latest + windows-latest) and the `uv run sofer --help`
# smoke test (issue #209); the COV-06 core-coverage gate in the
# coverage job is tracked separately as issue #185.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync

      - name: Lint with ruff
        run: uv run ruff check src/ tests/ scripts/

      - name: Type check with mypy
        run: uv run mypy src/ scripts/

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync

      - name: Run tests
        run: uv run pytest -v

      - name: Run CLI help smoke test
        run: uv run sofer --help

  coverage:
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync

      # ── Complete-suite coverage gate (CI-01 + PB-05) ─────────────────────
      # `uv run coverage run -m pytest` re-executes the FULL suite under
      # instrumentation — never a focused subset. The 90% floor is declared
      # once in pyproject.toml under [tool.coverage.report]; the gate is
      # config-declared and never flag-driven — coverage.py reads the floor
      # itself, so no threshold literal or CLI flag belongs in this file.
      - name: Run tests under coverage
        run: uv run coverage run -m pytest

      # The gate: coverage.py enforces the config-declared floor and exits
      # non-zero below it. `-m` puts per-file missed lines in the job log.
      - name: Report coverage with missing lines (the gate)
        run: uv run coverage report -m

      # ── CLI-core 100% gates (COV-06, AGENTS.md rule 14) ─────────────
      # Same script the ci.yml coverage job runs — see the comment there.
      # Additive and scoped per file; the TOTAL gate stays config-owned.
      - name: Gate core module coverage (COV-06)
        run: bash scripts/check_core_coverage.sh

      - name: Generate HTML coverage report
        run: uv run coverage html

      # Self-hosted evidence (CI-02): htmlcov artifact, no third-party service.
      # retention-days deliberately omitted — GitHub's 90-day default is
      # platform policy, not a value this repo should hardcode.
      - name: Upload htmlcov artifact
        uses: actions/upload-artifact@v7
        with:
          name: coverage-html
          path: htmlcov

  build:
    needs: [lint, test, coverage]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync

      - name: Build distribution
        run: uv build --out-dir dist

      - name: Verify wheel METADATA version matches the tag
        run: |
          WHEEL=$(ls dist/sofer-*.whl)
          VERSION=$(unzip -p "$WHEEL" 'sofer-*.dist-info/METADATA' | sed -n 's/^Version: //p')
          test "$VERSION" = "${GITHUB_REF_NAME#v}"

      - name: Verify wheel METADATA completeness (PKG-02)
        run: |
          WHEEL=$(ls dist/sofer-*.whl)
          unzip -p "$WHEEL" 'sofer-*.dist-info/METADATA' > metadata.txt
          grep -q '^Classifier:' metadata.txt
          grep -q '^Project-URL:' metadata.txt

      - name: Verify console-script entry point
        run: |
          WHEEL=$(ls dist/sofer-*.whl)
          unzip -p "$WHEEL" '*/entry_points.txt' | grep -q 'sofer = sofer.cli:main'

      - name: Verify LICENSE bundled
        run: |
          WHEEL=$(ls dist/sofer-*.whl)
          unzip -l "$WHEEL" | grep -q 'licenses/LICENSE'

  citation-check:
    needs: [coverage]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Bare runner python on purpose: update_citation.py is stdlib-only, so
      # no `uv sync` is needed. Keep it that way.
      - name: Verify CITATION.cff matches the release tag
        run: python scripts/update_citation.py --check --version "${GITHUB_REF_NAME#v}"

  release:
    needs: [lint, test, build, citation-check, coverage]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true