name: Release

# Publishes a GitHub Release when a version tag (v*) is pushed.
# Runs the same quality gates as CI first; if anything fails,
# no release is created.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync

      - name: Lint with ruff
        run: uv run ruff check src/ tests/ scripts/

      - name: Type check with mypy
        run: uv run mypy src/ scripts/

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync

      - name: Run tests
        run: uv run pytest -v

  build:
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync

      - name: Build distribution
        run: uv build --out-dir dist

      - name: Verify wheel METADATA version matches the tag
        run: |
          WHEEL=$(ls dist/sofer-*.whl)
          VERSION=$(unzip -p "$WHEEL" 'sofer-*.dist-info/METADATA' | sed -n 's/^Version: //p')
          test "$VERSION" = "${GITHUB_REF_NAME#v}"

      - name: Verify wheel METADATA completeness (PKG-02)
        run: |
          WHEEL=$(ls dist/sofer-*.whl)
          unzip -p "$WHEEL" 'sofer-*.dist-info/METADATA' > metadata.txt
          grep -q '^Classifier:' metadata.txt
          grep -q '^Project-URL:' metadata.txt

      - name: Verify console-script entry point
        run: |
          WHEEL=$(ls dist/sofer-*.whl)
          unzip -p "$WHEEL" '*/entry_points.txt' | grep -q 'sofer = sofer.cli:main'

      - name: Verify LICENSE bundled
        run: |
          WHEEL=$(ls dist/sofer-*.whl)
          unzip -l "$WHEEL" | grep -q 'licenses/LICENSE'

  citation-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify CITATION.cff matches the release tag
        run: python scripts/update_citation.py --check --version "${GITHUB_REF_NAME#v}"

  release:
    needs: [lint, test, build, citation-check]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
