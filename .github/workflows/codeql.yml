name: CodeQL

# Advanced Setup, versioned in the repo (CI-04): enabled by this workflow —
# never by GitHub's Default Setup UI. The weekly cron keeps dormant-branch
# coverage; the Monday 03:00 UTC slot is off-peak.
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  schedule:
    - cron: "0 3 * * 1"

# Declaring any permissions block resets the rest to `none`, so `contents: read`
# is REQUIRED for checkout, `actions: read` is GitHub's documented minimum for
# CodeQL, and `security-events: write` lets the analyze step upload SARIF.
permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: python
          config-file: ./.github/codeql/config.yml

      # While the repository is private, code scanning cannot be enabled: it
      # requires GitHub Code Security on private repos, so uploading SARIF to
      # the Security tab is rejected and would fail this job on every run.
      # `upload: never` keeps the analysis running and writes the SARIF to the
      # path below, published as a workflow artifact instead.
      #
      # WHEN THE REPOSITORY BECOMES PUBLIC: set `upload: always` (or delete the
      # input) and the Security tab takes over; the artifact step below can stay.
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          upload: never
          output: codeql-results

      - name: Upload CodeQL SARIF results
        uses: actions/upload-artifact@v7
        with:
          name: codeql-sarif
          path: codeql-results/*.sarif
          if-no-files-found: error
