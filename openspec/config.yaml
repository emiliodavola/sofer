# openspec/config.yaml — SDD configuration for sofer
# Generated by sdd-init on 2026-08-03; reconciled by sdd-init on 2026-08-30.
# Mode: hybrid (openspec + engram).
schema: spec-driven

context: |
  Tech stack: Python 3.10+ CLI tool, uv + hatchling, ruff 0.16.0 (lint+format), mypy 2.3.0.
  Architecture: flat src/sofer/ package, argparse CLI with func dispatch, one module per concern.
  Testing: pytest 9.1.1, spec-driven scenarios; Strict TDD disabled (tests follow specs but red-green-refactor is not enforced per mem #441). Run `uv run pytest tests/ -q` for the authoritative tally.
  Style: no hardcoded values (config via pyproject [tool.sofer] + per-dataset TOML), mandatory docstrings,
  English artifacts. See AGENTS.md for the full repo conventions.

strict_tdd: false

testing:
  strict_tdd: false
  test_command: "uv run pytest tests/ -q"
  ci_test_command: "uv run pytest -v"
  runner: pytest
  runner_version: "9.1.1"
  layers:
    unit: {available: true, tool: pytest}
    integration: {available: false, tool: null}
    e2e: {available: false, tool: null}
  coverage:
    available: true
    command: "uv run coverage run -m pytest"
  quality:
    linter: {available: true, command: "uv run ruff check src/ tests/"}
    type_checker: {available: true, command: "uv run mypy src/"}
    formatter: {available: true, command: "uv run ruff format"}
  pre_commit: "ruff --fix + ruff-format + mypy (uv run mypy src/), runs on every commit"

rules:
  proposal:
    - Include intent, scope (in/out), and approach; reference affected openspec specs.
    - No hardcoded values in proposed changes — defaults go in [tool.sofer] or DatasetConfig.
  specs:
    - Use Given/When/Then scenarios; use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY).
    - Every spec scenario MUST map to a repository test (test:) or to declared verify-phase evidence
      (verify:); every data row of a `## Test Mapping` table begins with exactly one such prefix.
    - The test-mapping checker (scripts/check_test_mapping.py) verifies that a `test:` reference exists
      and is collected by pytest — existence/collection, not exercise. Specs without a table are
      recorded in openspec/test-mapping-registry.md and stay outside the gate until they adopt one.
  design:
    - Follow the one-module-per-concern layout; document orchestration flow for _cmd_* handlers.
    - Document architecture decisions with rationale; update CLI help= and README in the same change.
  tasks:
    - Group by phase, use hierarchical numbering; keep tasks completable in one session.
    - Every module gets a module-level docstring; public functions/classes get param/return docstrings.
  apply:
    - Follow existing code patterns; read values from config, never hardcode defaults.
    - tdd: false
    - test_command: "uv run pytest tests/ -q"
  verify:
    - test_command: "uv run pytest tests/ -q"
    - build_command: "uv run ruff check src/ tests/ && uv run mypy src/"
    - coverage_threshold: 90
  archive:
    - Warn before merging destructive deltas.
